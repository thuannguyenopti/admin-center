<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opal Multi-Agent Chat Prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      width: 100%;
      height: 100vh;
      background: #f9fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .chat-container {
      width: 100%;
      max-width: 800px;
      height: 100%;
      background: white;
      border: 1px solid #dadfeb;
      border-radius: 8px;
      box-shadow: -6px 6px 25px 0px rgba(12,16,29,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      border-bottom: 1px solid #e9edf5;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left, .header-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .header button {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 500;
      color: #2e3442;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message-user {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: flex-start;
    }

    .message-user-bubble {
      background: #e9edf5;
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 70%;
      font-size: 14px;
      color: #080736;
      line-height: 1.6;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e9edf5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .message-agent {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .agent-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .agent-content {
      flex: 1;
    }

    .agent-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .agent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .agent-name {
      font-size: 12px;
      font-weight: 600;
    }

    .agent-text {
      font-size: 14px;
      color: #080736;
      line-height: 1.6;
    }

    .message-unified {
      background: linear-gradient(135deg, #ede9fe 0%, #f3f4f6 100%);
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #7c3aed;
      font-size: 14px;
      color: #080736;
      line-height: 1.6;
      white-space: pre-line;
    }

    .task-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }

    .task-divider-line {
      flex: 1;
      height: 1px;
      background: #e9edf5;
    }

    .task-divider-text {
      font-size: 12px;
      color: #66708c;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .continue-bar {
      background: #ede9fe;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #e9edf5;
      gap: 12px;
    }

    .continue-bar.hidden {
      display: none;
    }

    .continue-button {
      flex: 1;
      background: transparent;
      border: 2px solid #7c3aed;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #7c3aed;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .continue-button:hover {
      background: #f5f3ff;
    }

    .new-task-button {
      background: transparent;
      border: 1px solid #c4b5fd;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      color: #7c3aed;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .new-task-button:hover {
      background: #f5f3ff;
    }

    .close-bar-button {
      background: transparent;
      border: none;
      color: #7c3aed;
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .close-bar-button:hover {
      background: #f5f3ff;
    }

    .input-area {
      padding: 16px 24px;
      border-top: 1px solid #e9edf5;
    }

    .input-box {
      border: 1px solid #7c3aed;
      border-radius: 8px;
      padding: 12px;
      background: white;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-textarea {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      color: #2e3442;
      resize: none;
      line-height: 1.6;
    }

    .input-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-icons {
      display: flex;
      gap: 8px;
    }

    .input-icons button {
      background: transparent;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }

    .send-button {
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .send-button:disabled {
      background: #e9edf5;
      opacity: 0.5;
      cursor: not-allowed;
    }

    .disclaimer {
      font-size: 11px;
      color: #66708c;
      margin-top: 4px;
      line-height: 16px;
    }

    .demo-tooltip {
      position: absolute;
      bottom: 120px;
      right: 40px;
      background: #7c3aed;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
      max-width: 280px;
      line-height: 1.5;
    }

    .demo-tooltip.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <button>☰</button>
        <button>➕</button>
      </div>
      <div class="header-title">Opal</div>
      <div class="header-right">
        <button>⛶</button>
        <button>⋯</button>
      </div>
    </div>

    <!-- Chat Body -->
    <div class="chat-body" id="chatBody">
      <!-- Messages will be inserted here -->
    </div>

    <!-- Continue Bar -->
    <div class="continue-bar hidden" id="continueBar">
      <button class="continue-button" id="continueBtn">
        <span>↻</span>
        <span id="continueText">Continue: Product page optimization</span>
      </button>
      <button class="new-task-button" id="newTaskBtn">Start new</button>
      <button class="close-bar-button" id="closeBarBtn" title="Cancel">✕</button>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-box">
        <textarea class="input-textarea" placeholder="Ask Opal anything..." id="inputText"></textarea>
        <div class="input-actions">
          <div class="input-icons">
            <button>🤖</button>
            <button>📎</button>
          </div>
          <button class="send-button" id="sendBtn">Demo: Ask Again</button>
        </div>
      </div>
      <p class="disclaimer">Opal can make mistakes. Double-check its responses.</p>
    </div>

    <!-- Demo Tooltip -->
    <div class="demo-tooltip" id="demoTooltip">
      <strong>Demo: </strong>Click "Demo: Ask Again" to see the task continuation pattern. You can continue the task, start new, or dismiss with ✕
    </div>
  </div>

  <script>
    const initialMessages = [
      {
        type: 'user',
        content: 'Help me improve conversion on my product page',
        avatar: '👤'
      },
      {
        type: 'agent',
        agent: 'Content Agent',
        agentColor: '#7c3aed',
        agentIcon: '✍️',
        content: 'I\'ll analyze your current messaging and value proposition. Let me review the page content...',
      },
      {
        type: 'agent',
        agent: 'Content Agent',
        agentColor: '#7c3aed',
        agentIcon: '✍️',
        content: 'I\'ve reviewed your product page. The headline could be more benefit-focused. Current: "Advanced Analytics Platform" → Suggested: "Turn Data Into Revenue-Driving Decisions in Minutes"',
      },
      {
        type: 'agent',
        agent: 'Data Agent',
        agentColor: '#0891b2',
        agentIcon: '📊',
        content: 'Building on that content analysis, I\'ve pulled your experiment data. Your current page has a 2.3% conversion rate with 156ms average engagement time. The bounce rate from paid traffic is 68%, suggesting a messaging mismatch.',
      },
      {
        type: 'agent',
        agent: 'Design Agent',
        agentColor: '#ea580c',
        agentIcon: '🎨',
        content: 'From a UX perspective, I see some issues. The CTA is below the fold on mobile (87% of your traffic). The hero section lacks visual hierarchy. I recommend: 1) Move CTA above fold, 2) Add visual proof points, 3) Reduce cognitive load in the first section.',
      },
      {
        type: 'unified',
        content: '**Unified Recommendation:**\n\nBased on our collaborative analysis:\n• **Content**: Revise headline to focus on speed + business impact\n• **Data**: Target paid traffic first (highest bounce rate)\n• **Design**: Restructure mobile experience with CTA prioritization\n\nExpected impact: 15-20% conversion lift based on similar optimization patterns.',
      }
    ];

    let messages = [...initialMessages];
    let currentTask = 'Product page optimization';

    const chatBody = document.getElementById('chatBody');
    const continueBar = document.getElementById('continueBar');
    const demoTooltip = document.getElementById('demoTooltip');
    const sendBtn = document.getElementById('sendBtn');
    const continueBtn = document.getElementById('continueBtn');
    const newTaskBtn = document.getElementById('newTaskBtn');
    const closeBarBtn = document.getElementById('closeBarBtn');
    const inputText = document.getElementById('inputText');

    function renderMessages() {
      chatBody.innerHTML = '';

      messages.forEach(msg => {
        if (msg.type === 'task-divider') {
          const divider = document.createElement('div');
          divider.className = 'task-divider';
          divider.innerHTML = `
            <div class="task-divider-line"></div>
            <span class="task-divider-text">${msg.content}</span>
            <div class="task-divider-line"></div>
          `;
          chatBody.appendChild(divider);
        } else if (msg.type === 'user') {
          const userMsg = document.createElement('div');
          userMsg.className = 'message-user';
          userMsg.innerHTML = `
            <div class="message-user-bubble">${msg.content}</div>
            <div class="user-avatar">${msg.avatar}</div>
          `;
          chatBody.appendChild(userMsg);
        } else if (msg.type === 'unified') {
          const unifiedMsg = document.createElement('div');
          unifiedMsg.className = 'message-unified';
          unifiedMsg.textContent = msg.content;
          chatBody.appendChild(unifiedMsg);
        } else if (msg.type === 'agent') {
          const agentMsg = document.createElement('div');
          agentMsg.className = 'message-agent';
          agentMsg.innerHTML = `
            <div class="agent-avatar" style="background: ${msg.agentColor}">
              ${msg.agentIcon}
            </div>
            <div class="agent-content">
              <div class="agent-header">
                <div class="agent-dot" style="background: ${msg.agentColor}"></div>
                <span class="agent-name" style="color: ${msg.agentColor}">${msg.agent}</span>
              </div>
              <div class="agent-text">${msg.content}</div>
            </div>
          `;
          chatBody.appendChild(agentMsg);
        }
      });

      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function showContinueBar() {
      continueBar.classList.remove('hidden');
      demoTooltip.classList.add('hidden');
      sendBtn.textContent = 'Choose task option';
      sendBtn.disabled = true;
      inputText.disabled = true;
    }

    function hideContinueBar() {
      continueBar.classList.add('hidden');
      demoTooltip.classList.remove('hidden');
      sendBtn.textContent = 'Demo: Ask Again';
      sendBtn.disabled = false;
      inputText.disabled = false;
    }

    sendBtn.addEventListener('click', () => {
      if (!sendBtn.disabled) {
        showContinueBar();
      }
    });

    continueBtn.addEventListener('click', () => {
      messages.push({
        type: 'user',
        content: 'Can you help me with the mobile layout?',
        avatar: '👤'
      });
      messages.push({
        type: 'agent',
        agent: 'Design Agent',
        agentColor: '#ea580c',
        agentIcon: '🎨',
        content: 'Continuing our product page optimization... For the mobile layout, let me create a detailed wireframe focusing on the above-the-fold improvements we discussed.',
      });
      hideContinueBar();
      renderMessages();
    });

    newTaskBtn.addEventListener('click', () => {
      currentTask = 'Mobile layout redesign';
      messages.push({
        type: 'task-divider',
        content: 'New Task Started'
      });
      messages.push({
        type: 'user',
        content: 'Can you help me with the mobile layout?',
        avatar: '👤'
      });
      messages.push({
        type: 'agent',
        agent: 'Design Agent',
        agentColor: '#ea580c',
        agentIcon: '🎨',
        content: 'Starting fresh with mobile layout design. What specific page or section would you like to focus on?',
      });
      hideContinueBar();
      renderMessages();
    });

    closeBarBtn.addEventListener('click', () => {
      hideContinueBar();
    });

    // Initial render
    renderMessages();
  </script>
</body>
</html>
